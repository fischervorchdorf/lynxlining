server {
    listen 80;
    server_name lynx-lining.com www.lynx-lining.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lynx-lining.com www.lynx-lining.com;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/lynx-lining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lynx-lining.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # www -> non-www redirect
    if ($host = www.lynx-lining.com) {
        return 301 https://lynx-lining.com$request_uri;
    }

    # Root redirect to /de/
    location = / {
        return 302 /de/;
    }

    # Static files (cached)
    location /images/ {
        alias /var/www/lynx-lining/src/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /css/ {
        alias /var/www/lynx-lining/src/public/css/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /js/ {
        alias /var/www/lynx-lining/src/public/js/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /pdf/ {
        alias /var/www/lynx-lining/src/public/pdf/;
        expires 30d;
        access_log off;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Upload limit (10MB)
    client_max_body_size 10M;

    # Reverse Proxy to Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
