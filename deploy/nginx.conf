##############################################################
# LYNX Lining – nginx Konfiguration
#
# Unterstützt zwei Deployment-Modi:
#   A) Coolify-Proxy (SSL-Terminierung durch Coolify/Traefik):
#      Coolify → nginx:80 (HTTP, mit X-Forwarded-Proto: https)
#      → nginx darf NICHT nochmals auf HTTPS redirecten!
#
#   B) Direkt-VPS ohne vorgelagerten Proxy:
#      Browser → nginx:80 → Redirect zu HTTPS
#      Browser → nginx:443 → Node.js
##############################################################

# www-Redirect-Ziel explizit setzen (non-www bevorzugt)
map $host $www_redirect {
    "www.lynx-lining.com" 1;
    default               0;
}

# Erkennung: kommt Request bereits über HTTPS-Proxy?
map $http_x_forwarded_proto $is_https_proxy {
    "https"  1;
    default  0;
}

# ---------- Port 80 ----------
server {
    listen 80;
    server_name lynx-lining.com www.lynx-lining.com;

    # www → non-www (egal ob Proxy oder direkt)
    if ($www_redirect) {
        return 301 https://lynx-lining.com$request_uri;
    }

    # Direkt-HTTP ohne Proxy → zu HTTPS umleiten (kein Loop-Risiko)
    if ($is_https_proxy = 0) {
        return 301 https://lynx-lining.com$request_uri;
    }

    # Hinter HTTPS-Proxy (Coolify): direkt an Node.js durchreichen
    include /etc/nginx/snippets/lynx-proxy.conf;
}

# ---------- Port 443 (nur bei Direkt-VPS ohne vorgelagerten Proxy) ----------
server {
    listen 443 ssl http2;
    server_name lynx-lining.com www.lynx-lining.com;

    # SSL (Let's Encrypt – beide Domains einschließen!)
    ssl_certificate     /etc/letsencrypt/live/lynx-lining.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lynx-lining.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # www → non-www
    if ($host = www.lynx-lining.com) {
        return 301 https://lynx-lining.com$request_uri;
    }

    # Statische Dateien (gecacht)
    location /images/ {
        alias /var/www/lynx-lining/src/public/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /css/ {
        alias /var/www/lynx-lining/src/public/css/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /js/ {
        alias /var/www/lynx-lining/src/public/js/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location /pdf/ {
        alias /var/www/lynx-lining/src/public/pdf/;
        expires 30d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    client_max_body_size 10M;

    include /etc/nginx/snippets/lynx-proxy.conf;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
